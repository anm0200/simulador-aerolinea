sonar.projectKey=anm0200_simulador-aerolinea
sonar.organization=anm0200
sonar.projectName=simulador-aerolinea

# 1. Declaramos que es un proyecto con múltiples módulos
sonar.modules=frontend,backend

# 2. Configuración específica del Frontend
frontend.sonar.sources=src
frontend.sonar.exclusions=**/node_modules/**,**/dist/**,**/.angular/**,**/*.spec.ts,**/*.test.ts
frontend.sonar.javascript.lcov.reportPaths=coverage/lcov.info

# 3. Configuración específica del Backend
backend.sonar.sources=src
backend.sonar.exclusions=**/node_modules/**,**/dist/**,**/*.spec.ts,**/*.test.ts,prisma/**
backend.sonar.javascript.lcov.reportPaths=coverage/lcov.info