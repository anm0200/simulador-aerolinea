name: CI - Verificaciones TFG

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # 1. Verificación de Formato Global (Root, Frontend, Backend)
  formato:
    name: "Calidad: Formato y Estilo"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Instalar Prettier
        run: npm install -g prettier
      - name: Verificar Formato (Global)
        run: prettier --check "**/*.{ts,js,json,html,css,yml,md}" --ignore-path .gitignore

  # 2. Frontend: Instalación, Tests y Build
  frontend:
    name: "Frontend: Calidad y Build"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Instalación Limpia
        run: npm ci
      - name: Ejecutar Tests de Logica (Vitest)
        run: npm test -- --run
      - name: Compilar Proyecto Angular
        run: npm run build

  # 3. Backend: Instalación y Compilación
  backend:
    name: "Backend: Calidad y Compilación"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - name: Instalación Limpia
        run: npm ci
      - name: Generar Cliente Prisma
        run: npx prisma generate
      - name: Verificar Compilación (TypeScript)
        run: npx tsc --noEmit
