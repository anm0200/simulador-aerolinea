name: CI - Verificaciones TFG

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # 1. Verificación de Formato
  formato:
    name: "Calidad: Formato (Prettier)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Instalar Prettier
        run: npm install -g prettier
      - name: Verificar Formato
        run: prettier --check "**/*.{ts,js,json,html,css,yml,md}" --ignore-path .gitignore

  # 2. Frontend: Tests de Lógica
  frontend-tests:
    name: "Frontend: Pruebas Unitarias"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Instalación
        run: npm ci
      - name: Ejecutar Vitest con Cobertura
        run: npx vitest run --config vite.config.ts --coverage --coverage.reporter=lcov --coverage.reporter=text
      - name: Guardar reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend
          path: frontend/coverage/

  # 3. Frontend: Build y Compilación
  frontend-build:
    name: "Frontend: Compilación de Producción"
    needs: [frontend-tests]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Instalación
        run: npm ci
      - name: Build Angular
        run: npm run build

  # 4. Backend: Cliente Prisma
  backend-prisma:
    name: "Backend: Generación de Prisma"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Instalación
        run: npm ci
      - name: Prisma Generate
        run: npx prisma generate

  # 5. Backend: Tests de Lógica
  backend-tests:
    name: "Backend: Pruebas Unitarias"
    needs: [backend-prisma]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Instalación
        run: npm ci
      - name: Prisma Generate
        run: npx prisma generate
      - name: Ejecutar Vitest con Cobertura
        run: npx vitest run --coverage --coverage.reporter=lcov --coverage.reporter=text
      - name: Guardar reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage-backend
          path: backend/coverage/

  # 6. Backend: Compilación TypeScript
  backend-compilacion:
    name: "Backend: Verificación TypeScript"
    needs: [backend-tests]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Instalación
        run: npm ci
      - name: Prisma Generate
        run: npx prisma generate
      - name: TSC NoEmit
        run: npx tsc --noEmit

  # 7. Análisis de Calidad con SonarCloud
  sonarcloud:
    name: "Calidad: Análisis (SonarCloud)"
    needs: [frontend-tests, backend-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Descargar cobertura frontend
        uses: actions/download-artifact@v4
        with:
          name: coverage-frontend
          path: frontend/coverage/

      - name: Descargar cobertura backend
        uses: actions/download-artifact@v4
        with:
          name: coverage-backend
          path: backend/coverage/

      - name: Escaneo de SonarCloud
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # 8. Pruebas End-to-End (Selenium)
  e2e-tests:
    name: "Calidad: Pruebas End-to-End (Selenium)"
    needs: [frontend-build, backend-compilacion]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Levantar Infraestructura (Docker)
        run: docker compose up -d --build

      - name: Instalar dependencias E2E
        working-directory: e2e
        run: npm ci || npm install

      - name: Esperar a que el backend y frontend estén listos
        run: |
          sleep 15
          curl --retry 5 --retry-delay 5 --retry-connrefused http://localhost:4200
          curl --retry 5 --retry-delay 5 --retry-connrefused http://localhost:3000/api/health || true

      - name: Ejecutar Tests E2E
        working-directory: e2e
        env:
          CI: true
        run: npm run test

  # 9. Despliegue Continuo en Azure (Docker)
  deploy-azure:
    name: "CD: Despliegue en Azure"
    needs: [sonarcloud, e2e-tests] # Solo despliega si Sonar y Selenium están perfectos
    if: github.ref == 'refs/heads/main' # Solo despliega cuando se hace push a main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Desplegar por SSH en Azure
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_HOST }}
          username: ${{ secrets.AZURE_USER }}
          key: ${{ secrets.AZURE_SSH_KEY }}
          script: |
            # 1. Si no existe la carpeta, la crea y clona el repo
            if [ ! -d "simulador-aerolinea" ]; then
              git clone https://github.com/anm0200/simulador-aerolinea.git
            fi

            # 2. Entra en la carpeta
            cd simulador-aerolinea

            # 3. Descarga los últimos cambios
            git pull origin main

            # 4. Reconstruye y levanta Docker en segundo plano
            sudo docker-compose down
            sudo docker-compose up -d --build
