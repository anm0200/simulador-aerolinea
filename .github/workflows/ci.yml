name: CI - Verificaciones TFG

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # 1. Verificación de Formato
  formato:
    name: "Calidad: Formato (Prettier)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Instalar Prettier
        run: npm install -g prettier
      - name: Verificar Formato
        run: prettier --check "**/*.{ts,js,json,html,css,yml,md}" --ignore-path .gitignore

  # 2. Frontend: Tests de Lógica
  frontend-tests:
    name: "Frontend: Pruebas Unitarias"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Instalación
        run: npm ci
      - name: Ejecutar Vitest
        run: npx vitest run --config vite.config.ts

  # 3. Frontend: Build y Compilación
  frontend-build:
    name: "Frontend: Compilación de Producción"
    needs: [frontend-tests]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Instalación
        run: npm ci
      - name: Build Angular
        run: npm run build

  # 4. Backend: Cliente Prisma
  backend-prisma:
    name: "Backend: Generación de Prisma"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Instalación
        run: npm ci
      - name: Prisma Generate
        run: npx prisma generate

  # 5. Backend: Tests de Lógica
  backend-tests:
    name: "Backend: Pruebas Unitarias"
    needs: [backend-prisma]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Instalación
        run: npm ci
      - name: Prisma Generate
        run: npx prisma generate
      - name: Ejecutar Vitest
        run: npm test

  # 6. Backend: Compilación TypeScript
  backend-compilacion:
    name: "Backend: Verificación TypeScript"
    needs: [backend-tests]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Instalación
        run: npm ci
      - name: Prisma Generate
        run: npx prisma generate
      - name: TSC NoEmit
        run: npx tsc --noEmit
